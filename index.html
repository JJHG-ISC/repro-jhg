<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Nay ✦</title>
<style>
  :root {
    --bg:       #080412;
    --panel:    #100720;
    --border:   #2a1550;
    --muted:    #5a2fa0;
    --light:    #c9a8f0;
    --a1:       #7a3ebb;
    --a2:       #e91e63;
    --near:     #9c6fd0;
    --active-bg:#1a0838;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--light);
    font-family:'Courier New',monospace;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:20px;
  }
  .container{
    display:flex;gap:16px;width:100%;max-width:1080px;height:88vh;max-height:720px;
  }

  /* ── PANELS ── */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 20px;
    display:flex;flex-direction:column;
  }
  .left{flex:5;align-items:center;gap:0;}
  .right{flex:7;}

  /* ── HEADER ── */
  .header{
    font-size:12px;font-weight:bold;color:#9c27b0;
    letter-spacing:5px;text-align:center;margin-bottom:16px;
    opacity:.85;
  }

  /* ── ALBUM ART ── */
  .art-wrap{
    position:relative;width:220px;height:220px;margin:0 auto 18px;
    flex-shrink:0;
  }
  .art-wrap::before{
    content:'';position:absolute;inset:-3px;border-radius:14px;
    background:linear-gradient(135deg,var(--a1),var(--a2));
    opacity:.6;z-index:0;
    animation:rotateBorder 4s linear infinite;
  }
  @keyframes rotateBorder{
    0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}
  }
  .art-wrap img{
    position:relative;z-index:1;
    width:100%;height:100%;object-fit:cover;
    border-radius:12px;display:block;
  }
  .art-wrap .art-placeholder{
    position:relative;z-index:1;
    width:100%;height:100%;border-radius:12px;
    background:linear-gradient(135deg,#1a0630,#0d1a40);
    display:flex;align-items:center;justify-content:center;
    font-size:48px;color:var(--a1);
  }

  /* ── TRACK INFO ── */
  .info{width:100%;padding:0 4px;margin-bottom:10px;}
  .key{font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:2px;}
  .val{font-size:14px;font-weight:bold;color:#fff;margin-bottom:6px;}
  .val-sub{font-size:11px;color:var(--light);margin-bottom:4px;}
  .status{font-size:11px;color:var(--muted);}
  .status.playing{color:var(--a2);}
  .status.paused{color:var(--a1);}

  /* ── SPECTRUM LABEL ── */
  .spec-label{
    font-size:9px;color:var(--muted);letter-spacing:2px;
    width:100%;padding:0 4px;margin-bottom:4px;
    margin-top:4px;
  }

  /* ── VISUALIZER ── */
  .visualizer{
    display:flex;align-items:flex-end;justify-content:center;
    height:52px;gap:3px;width:100%;margin-bottom:12px;
    padding:0 2px;
  }
  .bar{
    flex:1;max-width:10px;border-radius:2px 2px 0 0;
    background:var(--bar-color,#7a3ebb);
    height:4px;
    transition:height .08s ease;
  }

  /* ── PROGRESS ── */
  .progress-wrap{width:100%;margin-bottom:6px;}
  .progress-track{
    width:100%;height:5px;background:#1a0830;border-radius:3px;
    cursor:pointer;position:relative;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;border-radius:3px;pointer-events:none;
    background:linear-gradient(to right,var(--a1),var(--a2));
    transition:width .1s linear;
  }
  .time-row{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--muted);margin-top:4px;
  }

  /* ── CONTROLS ── */
  .controls{
    display:flex;justify-content:center;align-items:center;
    gap:14px;margin-top:12px;width:100%;
  }

  /* Circle buttons */
  .cbtn{
    border:none;background:none;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .cbtn svg{display:block;}

  /* Small circle (prev/next) */
  .cbtn-sm{width:40px;height:40px;}
  .cbtn-sm .circle{
    fill:#130825;stroke:var(--a1);stroke-width:1.2;
    transition:fill .15s,stroke .15s;
  }
  .cbtn-sm:hover .circle{fill:#1e0d33;stroke:var(--light);}
  .cbtn-sm:active .circle{fill:#2a1050;}
  .cbtn-sm .icon{fill:var(--light);transition:fill .15s;}
  .cbtn-sm:hover .icon{fill:#fff;}

  /* Large circle (play/pause) */
  .cbtn-lg{width:52px;height:52px;}
  .cbtn-lg .circle{
    fill:url(#grad-play);
    transition:opacity .15s;
  }
  .cbtn-lg:hover .circle{opacity:.85;}
  .cbtn-lg:active .circle{opacity:.7;}
  .cbtn-lg .icon{fill:#fff;}

  /* Volume row */
  .vol-row{
    display:flex;align-items:center;gap:8px;
    width:100%;margin-top:10px;padding:0 2px;
  }
  .vol-icon{font-size:11px;color:var(--muted);flex-shrink:0;}
  .vol-track{
    flex:1;height:4px;background:#1a0830;border-radius:2px;
    cursor:pointer;position:relative;
  }
  .vol-fill{
    height:100%;border-radius:2px;
    background:linear-gradient(to right,var(--a1),var(--a2));
    pointer-events:none;width:80%;
    transition:width .05s;
  }
  .vol-thumb{
    position:absolute;top:50%;width:12px;height:12px;
    background:#fff;border:2px solid var(--a1);border-radius:50%;
    transform:translate(-50%,-50%);
    left:80%;cursor:grab;transition:border-color .15s;
  }
  .vol-thumb:hover{border-color:var(--a2);}
  .vol-pct{font-size:10px;color:var(--muted);width:28px;text-align:right;flex-shrink:0;}

  /* ── RIGHT PANEL ── */
  .lyr-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;flex-shrink:0;
  }
  .lyr-title{font-size:13px;font-weight:bold;color:#9c27b0;letter-spacing:2px;}
  .lyr-sync{font-size:10px;color:var(--a2);display:flex;align-items:center;gap:4px;}
  .sync-dot{
    width:6px;height:6px;border-radius:50%;background:var(--a2);
    display:inline-block;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}

  .lyr-area{
    flex:1;overflow-y:auto;padding-right:8px;
    scroll-behavior:smooth;
  }
  .lyr-area::-webkit-scrollbar{width:3px;}
  .lyr-area::-webkit-scrollbar-track{background:transparent;}
  .lyr-area::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}

  .lyr-spacer{height:200px;}
  .lyr-line{
    font-size:15px;color:#2d1a50;padding:7px 12px;
    border-radius:6px;margin-bottom:6px;
    transition:all .35s cubic-bezier(.4,0,.2,1);
    border-left:3px solid transparent;
    line-height:1.5;
  }
  .lyr-near{font-size:16px;color:var(--near);}
  .lyr-active{
    font-size:19px;color:#fff;background:var(--active-bg);
    font-weight:bold;border-left:3px solid var(--a2);
    padding:10px 16px;border-radius:8px;
    text-shadow:0 0 20px rgba(233,30,99,.3);
  }

  @media(max-width:700px){
    .container{flex-direction:column;height:auto;max-height:none;}
    .right{height:420px;}
  }
</style>
</head>
<body>
<div class="container">

  <!-- ══ LEFT ══ -->
  <div class="panel left">
    <div class="header">✦ &nbsp; T E &nbsp; A M O &nbsp; ✦</div>

    <div class="art-wrap">
      <img src="NSQK.jpg" alt="Album art"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="art-placeholder" style="display:none">★</div>
    </div>

    <div class="info">
      <div class="key">TRACK</div>
      <div class="val">NSQK - Sur Interludio</div>
      <div class="key">ARTIST</div>
      <div class="val-sub">NSQK</div>
      <div class="status" id="status">■ &nbsp;stopped</div>
    </div>

    <div class="spec-label">SPECTRUM</div>
    <div class="visualizer" id="viz"></div>

    <div class="progress-wrap">
      <div class="progress-track" id="prog-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
      <div class="time-row">
        <span id="t-cur">0:00</span>
        <span id="t-tot">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- PREV -->
      <button class="cbtn cbtn-sm" id="btn-prev" title="−10s">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <defs>
            <linearGradient id="grad-play" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7a3ebb"/>
              <stop offset="100%" stop-color="#e91e63"/>
            </linearGradient>
          </defs>
          <circle class="circle" cx="20" cy="20" r="18.5"/>
          <!-- two triangles pointing left + bar -->
          <rect class="icon" x="10" y="13" width="2.5" height="14" rx="1.2"/>
          <polygon class="icon" points="24,13 14,20 24,27"/>
        </svg>
      </button>

      <!-- PLAY / PAUSE -->
      <button class="cbtn cbtn-lg" id="btn-play" title="Play / Pause">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <defs>
            <linearGradient id="grad-play2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7a3ebb"/>
              <stop offset="100%" stop-color="#e91e63"/>
            </linearGradient>
          </defs>
          <circle class="circle" cx="26" cy="26" r="24.5" fill="url(#grad-play2)"/>
          <!-- play icon (default) -->
          <polygon class="icon" id="ico-play" points="21,17 21,35 38,26"/>
          <!-- pause icon (hidden) -->
          <g id="ico-pause" style="display:none">
            <rect class="icon" x="17" y="17" width="6" height="18" rx="2"/>
            <rect class="icon" x="29" y="17" width="6" height="18" rx="2"/>
          </g>
        </svg>
      </button>

      <!-- NEXT -->
      <button class="cbtn cbtn-sm" id="btn-next" title="+10s">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle class="circle" cx="20" cy="20" r="18.5"/>
          <!-- two triangles pointing right + bar -->
          <polygon class="icon" points="16,13 26,20 16,27"/>
          <rect class="icon" x="27.5" y="13" width="2.5" height="14" rx="1.2"/>
        </svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="vol-row">
      <span class="vol-icon">VOL</span>
      <div class="vol-track" id="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
        <div class="vol-thumb" id="vol-thumb"></div>
      </div>
      <span class="vol-pct" id="vol-pct">80%</span>
    </div>

    <audio id="audio" src="sur.mp3" preload="auto"></audio>
  </div>

  <!-- ══ RIGHT ══ -->
  <div class="panel right">
    <div class="lyr-header">
      <div class="lyr-title">&gt;&nbsp; lyrics</div>
      <div class="lyr-sync">
        <span class="sync-dot" id="sync-dot"></span>
        online &nbsp;■&nbsp; sync ✓
      </div>
    </div>
    <div class="lyr-area" id="lyr-area">
      <div class="lyr-spacer"></div>
    </div>
  </div>

</div>

<script>
const LRC = `
[00:13.59] Ten mi nombre, ten mi aliento
[00:19.84] Que, si no estás no sirven
[00:26.24] Ten mis hombros, ten mis dientes
[00:33.50] Que, tú no entiendes, no
[00:38.63] Porque todo vuelve a ti
[00:45.74] Todo vuelve a ti
[00:52.21] Todo vuelve a ti
[00:55.19] Como aves al sur en invierno
[00:58.51] Como el sol y la luna en el cielo
[01:01.75] Los fantasmas me siguen diciendo
[01:07.99] (Ten mi, ten mi nombre, nombre)
[01:11.58] (Ten-ten-ten mi alien-aliento-to)
[01:14.96] (Y no estás-tás-tás)
[01:18.44] (y no estás-tás-tás, no)
[01:22.10] (Ten mi hom-hombro)
[01:25.62] (Ten, ten dientes)
[01:28.92] (Tú no entiendes-tiendes-tiendes)
[01:32.49] (No, no, no, -tiendes-es-es)
`;

/* ── parse ── */
const lyrics = [];
LRC.trim().split('\n').forEach(l => {
  const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/.exec(l);
  if (!m) return;
  const t = +m[1]*60 + +m[2] + +m[3].padEnd(3,'0')/1000;
  const txt = m[4].trim();
  if (txt) lyrics.push({t, txt});
});

/* ── dom ── */
const audio    = document.getElementById('audio');
const btnPlay  = document.getElementById('btn-play');
const btnPrev  = document.getElementById('btn-prev');
const btnNext  = document.getElementById('btn-next');
const icoPlay  = document.getElementById('ico-play');
const icoPause = document.getElementById('ico-pause');
const progTrack= document.getElementById('prog-track');
const progFill = document.getElementById('prog-fill');
const tCur     = document.getElementById('t-cur');
const tTot     = document.getElementById('t-tot');
const statusEl = document.getElementById('status');
const lyrArea  = document.getElementById('lyr-area');
const viz      = document.getElementById('viz');
const volTrack = document.getElementById('vol-track');
const volFill  = document.getElementById('vol-fill');
const volThumb = document.getElementById('vol-thumb');
const volPct   = document.getElementById('vol-pct');
const syncDot  = document.getElementById('sync-dot');

/* ── build lyrics ── */
const lyrSpacer = lyrArea.querySelector('.lyr-spacer');
const lyrEls = [];
lyrics.forEach((ln, i) => {
  const d = document.createElement('div');
  d.className = 'lyr-line';
  d.textContent = ln.txt;
  lyrArea.appendChild(d);
  lyrEls.push(d);
});
const lyrSpacerEnd = document.createElement('div');
lyrSpacerEnd.style.height = '240px';
lyrArea.appendChild(lyrSpacerEnd);

/* ── build visualizer bars ── */
const BAR_COUNT = 28;
const barEls = [];
// Color palette: blue→cyan→green→yellow→orange→pink (rainbow EQ)
const barColors = [
  '#0066ff','#0088ff','#00aaff','#00ccff','#00eeff',
  '#00ffcc','#00ff99','#33ff66','#66ff33','#99ff00',
  '#ccff00','#ffff00','#ffdd00','#ffbb00','#ff9900',
  '#ff7700','#ff5500','#ff3300','#ff1166','#ff0099',
  '#dd00cc','#bb00ee','#9900ff','#7700ff','#5500ff',
  '#3300ff','#1100ff','#0000ee'
];
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'bar';
  b.style.setProperty('--bar-color', barColors[i] || '#7a3ebb');
  b.style.background = barColors[i] || '#7a3ebb';
  viz.appendChild(b);
  barEls.push(b);
}

/* ── helpers ── */
const fmt = t => isNaN(t) ? '0:00' : `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;

let playing = false;
let visRAF;
let lastActive = -1;

/* ── visualizer ── */
let barTargets = new Array(BAR_COUNT).fill(4);
let barCurrent = new Array(BAR_COUNT).fill(4);

function animViz() {
  if (!playing) { visRAF = null; return; }
  // update targets every ~80ms equivalent using a counter
  if (Math.random() < 0.4) {
    barTargets = barTargets.map(() => playing ? Math.random() * 46 + 6 : 4);
  }
  barCurrent = barCurrent.map((c, i) => c * 0.4 + barTargets[i] * 0.6);
  barEls.forEach((b, i) => { b.style.height = barCurrent[i].toFixed(1) + 'px'; });
  visRAF = requestAnimationFrame(animViz);
}

function stopViz() {
  if (visRAF) { cancelAnimationFrame(visRAF); visRAF = null; }
  barEls.forEach(b => { b.style.height = '4px'; });
}

/* ── play/pause ── */
function setPlaying(v) {
  playing = v;
  if (v) {
    icoPlay.style.display = 'none';
    icoPause.style.display = '';
    statusEl.textContent = '▶  playing';
    statusEl.className = 'status playing';
    syncDot.style.animationPlayState = 'running';
    animViz();
  } else {
    icoPlay.style.display = '';
    icoPause.style.display = 'none';
    statusEl.className = 'status paused';
    syncDot.style.animationPlayState = 'paused';
    stopViz();
  }
}

btnPlay.addEventListener('click', () => {
  if (audio.paused) { audio.play(); setPlaying(true); }
  else { audio.pause(); setPlaying(false); statusEl.textContent = '⏸  paused'; }
});

btnPrev.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
btnNext.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); });

/* ── progress ── */
audio.addEventListener('loadedmetadata', () => { tTot.textContent = fmt(audio.duration); });

audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? audio.currentTime / audio.duration : 0;
  progFill.style.width = (pct * 100).toFixed(2) + '%';
  tCur.textContent = fmt(audio.currentTime);

  // lyrics sync
  let ai = -1;
  for (let i = 0; i < lyrics.length; i++) {
    if (audio.currentTime >= lyrics[i].t) ai = i; else break;
  }
  if (ai !== lastActive) {
    lastActive = ai;
    lyrEls.forEach((el, i) => {
      el.className = 'lyr-line';
      if (i === ai) el.classList.add('lyr-active');
      else if (Math.abs(i - ai) === 1) el.classList.add('lyr-near');
    });
    if (ai >= 0) {
      const el = lyrEls[ai];
      const scrollTarget = el.offsetTop - lyrArea.clientHeight / 2 + el.clientHeight / 2;
      lyrArea.scrollTo({ top: scrollTarget, behavior: 'smooth' });
    }
  }
});

/* ── seek on progress bar ── */
function seekFromEvent(e) {
  const rect = progTrack.getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
  if (audio.duration) audio.currentTime = (x / rect.width) * audio.duration;
}
let draggingProg = false;
progTrack.addEventListener('mousedown', e => { draggingProg = true; seekFromEvent(e); });
window.addEventListener('mousemove', e => { if (draggingProg) seekFromEvent(e); });
window.addEventListener('mouseup', () => { draggingProg = false; });
progTrack.addEventListener('touchstart', e => { seekFromEvent(e.touches[0]); }, {passive:true});
progTrack.addEventListener('touchmove',  e => { seekFromEvent(e.touches[0]); }, {passive:true});

/* ── volume ── */
let volVal = 0.8;
audio.volume = volVal;

function setVol(v) {
  volVal = Math.max(0, Math.min(1, v));
  audio.volume = volVal;
  const pct = (volVal * 100).toFixed(0);
  volFill.style.width  = pct + '%';
  volThumb.style.left  = pct + '%';
  volPct.textContent   = pct + '%';
}
setVol(0.8);

function volFromEvent(e) {
  const rect = volTrack.getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
  setVol(x / rect.width);
}
let draggingVol = false;
volTrack.addEventListener('mousedown', e => { draggingVol = true; volFromEvent(e); });
window.addEventListener('mousemove', e => { if (draggingVol) volFromEvent(e); });
window.addEventListener('mouseup', () => { draggingVol = false; });
volTrack.addEventListener('touchstart', e => { volFromEvent(e.touches[0]); }, {passive:true});
volTrack.addEventListener('touchmove',  e => { volFromEvent(e.touches[0]); }, {passive:true});

/* ── end ── */
audio.addEventListener('ended', () => {
  setPlaying(false);
  statusEl.textContent = '■  stopped';
  statusEl.className = 'status';
  progFill.style.width = '0%';
  tCur.textContent = '0:00';
  lastActive = -1;
  lyrEls.forEach(el => el.className = 'lyr-line');
  lyrArea.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
